# ============================================================================
# dynamic.prod.yml — Traefik v3 dynamic configuration (PRODUCTION)
# API routes → Go Backend (direct PostgreSQL, no PostgREST)
# Domain: workflows.cl
# ============================================================================

http:
  routers:
    # API routes → Go Backend
    api:
      rule: "Host(`app.workflows.cl`) && PathPrefix(`/api`)"
      service: "go-backend"
      entryPoints:
        - "websecure"
      tls:
        certResolver: letsencrypt

    # Auth routes → Go Backend
    auth:
      rule: "Host(`app.workflows.cl`) && PathPrefix(`/auth`)"
      service: "go-backend"
      entryPoints:
        - "websecure"
      tls:
        certResolver: letsencrypt

    # Health check
    health:
      rule: "Host(`app.workflows.cl`) && PathPrefix(`/health`)"
      service: "go-backend"
      entryPoints:
        - "websecure"
      tls:
        certResolver: letsencrypt

  services:
    go-backend:
      loadBalancer:
        servers:
          - url: "http://go-backend:8080"
