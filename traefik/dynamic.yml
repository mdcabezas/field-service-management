# ============================================================================
# dynamic.yml — Traefik v3 dynamic configuration
# API routes → Go Backend (direct PostgreSQL, no PostgREST)
# Frontend → Next.js
# ============================================================================

http:
  routers:
    # Frontend → Next.js (catch-all)
    frontend:
      rule: "PathPrefix(`/`)"
      service: "frontend"
      entryPoints:
        - "web"

    # API routes → Go Backend
    api:
      rule: "PathPrefix(`/api`)"
      service: "go-backend"
      entryPoints:
        - "web"

    # Auth routes → Go Backend
    auth:
      rule: "PathPrefix(`/auth`)"
      service: "go-backend"
      entryPoints:
        - "web"

    # Health check
    health:
      rule: "PathPrefix(`/health`)"
      service: "go-backend"
      entryPoints:
        - "web"

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"

    go-backend:
      loadBalancer:
        servers:
          - url: "http://go-backend:8080"
