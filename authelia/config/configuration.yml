---
# ============================================================================
# Authelia configuration for FSM
# Dev: localhost / Prod: workflows.cl
# ============================================================================

server:
  address: 'tcp4://:9091'

log:
  level: info
  file_path: '/var/log/authelia/authelia.log'
  keep_stdout: true

# TOTP MFA (enabled for all users)
totp:
  disable: false
  issuer: 'workflows.cl'
  algorithm: sha1
  digits: 6
  period: 30
  skew: 1
  secret_size: 32

# Identity validation (reset password)
identity_validation:
  reset_password:
    jwt_secret: '${AUTHELIA_JWT_SECRET}'

# Password policy
password_policy:
  zxcvbn:
    enabled: true
    min_score: 3

# Authentication backend (LDAP via GLAuth)
authentication_backend:
  ldap:
    implementation: 'glauth'
    address: 'ldap://glauth:389'
    base_dn: 'dc=workflows,dc=cl'
    user: 'cn=authelia,dc=workflows,dc=cl'
    password: '${AUTHELIA_LDAP_PASSWORD}'
    users_filter: '(&(|(cn={input})(mail={input}))(objectClass=posixAccount)(!(disabled=TRUE)))'
    groups_filter: '(&(uniqueMember={dn})(objectClass=posixGroup))'
    group_name_attribute: 'cn'
    mail_attribute: 'mail'
    display_name_attribute: 'cn'

# Access control rules
access_control:
  default_policy: 'deny'
  rules:
    # API routes → bypass (JWT handles auth)
    - domain: '${AUTHELIA_APP_DOMAIN:-app.workflows.cl}'
      resources:
        - '^/users.*$'
        - '^/tech_roles.*$'
        - '^/visits.*$'
        - '^/daily_plans.*$'
        - '^/partner_agreements.*$'
        - '^/customers.*$'
        - '^/properties.*$'
        - '^/vehicles.*$'
        - '^/rpc/.*$'
        - '^/plan_audit_log.*$'
      policy: 'bypass'
    # Browser routes → two_factor
    - domain: '${AUTHELIA_APP_DOMAIN:-app.workflows.cl}'
      policy: 'two_factor'

# Session configuration
session:
  name: 'fsm_session'
  secret: '${AUTHELIA_SESSION_SECRET}'
  cookies:
    - domain: '${AUTHELIA_SESSION_DOMAIN}'
      authelia_url: '${AUTHELIA_AUTHELIA_URL}'
      default_redirection_url: '${AUTHELIA_DEFAULT_REDIRECT}'

# Brute force protection
regulation:
  max_retries: 5
  find_time: 120
  ban_time: 300

# Storage (SQLite)
storage:
  encryption_key: '${AUTHELIA_STORAGE_ENCRYPTION_KEY}'
  local:
    path: '/config/db.sqlite3'

# Notifications (filesystem for dev)
notifier:
  disable_startup_check: true
  filesystem:
    filename: '/config/notification.txt'
