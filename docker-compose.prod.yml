# ============================================================================
# docker-compose.prod.yml — FSM production stack
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: fsm-postgres
    environment:
      POSTGRES_DB: fsm_fsm
      POSTGRES_USER: fsm_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsm_admin -d fsm_fsm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fsm-internal
    restart: unless-stopped

  traefik:
    image: traefik:v3.0
    container_name: fsm-traefik
    depends_on:
      - go-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.prod.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - fsm-internal
    restart: unless-stopped

  glauth:
    image: glauth/glauth:latest
    container_name: fsm-glauth
    volumes:
      - ./glauth/config.toml:/etc/glauth/config.toml:ro
    networks:
      - fsm-internal
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=workflows,dc=cl -D cn=svc-localis,dc=workflows,dc=cl -w ${LDAP_SERVICE_PASSWORD} '(objectclass=*)' 2>/dev/null | grep -q 'numEntries'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  go-backend:
    build:
      context: ./backend
    container_name: fsm-go-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LDAP_URL: "ldap://glauth:389"
      LDAP_BASE_DN: "dc=workflows,dc=cl"
      LDAP_SERVICE_PASSWORD: ${LDAP_SERVICE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: "postgres://fsm_admin:${POSTGRES_PASSWORD}@postgres:5432/fsm_fsm?sslmode=disable"
    ports:
      - "8081:8080"
    networks:
      - fsm-internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: fsm-frontend
    depends_on:
      - go-backend
    environment:
      NEXT_PUBLIC_API_URL: "http://go-backend:8080"
    networks:
      - fsm-internal
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  letsencrypt:
    driver: local

networks:
  fsm-internal:
    driver: bridge
