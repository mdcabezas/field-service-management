# ============================================================================
# postgrest.conf — PostgREST configuration for FSM
# Sensitive values (jwt-secret, db-uri) passed via env vars in docker-compose.yml
# openapi-server-proxy-uri: overridden by PGRST_OPENAPI_SERVER_PROXY_URI in prod
# ============================================================================

db-schemas = "core, partners, customers, inventory, operations, planning, notifications, geocoding, shared, domain_gas"
db-anon-role = "fsm_api"
openapi-server-proxy-uri = "http://postgrest:3000"
db-pre-request = "public.set_user_context"
