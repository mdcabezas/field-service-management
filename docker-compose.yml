# ============================================================================
# docker-compose.yml — FSM dev stack
# Uso: docker compose up -d
# Con industry pack: docker compose -f docker-compose.yml -f industry-packs/gas/docker-compose.override.yml up -d
# ============================================================================
services:
  postgres:
    profiles: ["dev"]
    image: postgis/postgis:16-3.5
    container_name: fsm-postgres
    environment:
      POSTGRES_DB: fsm_fsm
      POSTGRES_USER: fsm_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FSM_API_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsm_admin -d fsm_fsm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fsm-internal
    restart: unless-stopped

  traefik:
    profiles: ["dev"]
    image: traefik:v3.0
    container_name: fsm-traefik
    depends_on:
      - go-backend
    ports:
      - "8088:8088"
      - "8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - fsm-internal
    restart: unless-stopped

  go-backend:
    profiles: ["dev"]
    build:
      context: ./backend
    container_name: fsm-go-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: "postgres://fsm_admin:${POSTGRES_PASSWORD}@postgres:5432/fsm_fsm?sslmode=disable"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      PHOTO_STORAGE_DIR: "/mobile-photos"
    ports:
      - "8081:8080"
    volumes:
      - photos:/mobile-photos
    networks:
      - fsm-internal
    restart: unless-stopped

  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend
    container_name: fsm-frontend
    depends_on:
      - go-backend
    environment:
      NEXT_PUBLIC_API_URL: "http://go-backend:8080"
    ports:
      - "3000:3000"
    networks:
      - fsm-internal
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  photos:
    driver: local

networks:
  fsm-internal:
    driver: bridge
